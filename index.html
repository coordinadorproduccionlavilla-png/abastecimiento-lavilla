<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abastecimiento La Villa</title>
<meta name="apple-mobile-web-app-title" content="Abastecimiento">
<meta name="application-name" content="Abastecimiento La Villa">
<meta name="theme-color" content="#CC1525">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{height:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
background:linear-gradient(135deg,#CC1525,#A80F1C);color:#fff;font-family:-apple-system,Roboto,Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
img{width:120px;height:120px;border-radius:28px;border:4px solid #F5A800}
h1{font-size:22px;margin:0}
a{display:inline-block;background:#F5A800;color:#1A1A1A;font-weight:800;text-decoration:none;padding:16px 28px;border-radius:16px;font-size:18px}
button{display:none;background:#fff;color:#CC1525;font-weight:800;border:0;padding:16px 28px;border-radius:16px;font-size:18px}
p{font-size:14px;opacity:.9;max-width:320px;line-height:1.4;margin:0}
/* Computador con la app instalada: la aplicación se carga dentro de esta misma ventana */
body.marco{padding:0;display:block;background:#fff}
#marco{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
body.marco #marco{display:block}
body.marco > :not(#marco):not(#plan){display:none}
#plan{display:none;position:fixed;right:10px;bottom:10px;z-index:5;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;text-decoration:none;font-weight:400}
</style>
</head>
<body>
<img src="icon-180.png" alt="Abastecimiento La Villa">
<h1>La Villa · Abastecimiento</h1>
<a id="ir" href="#">Entrar</a>
<button id="instalar">📲 Instalar en este celular</button>
<p id="ayuda">Abriendo…</p>
<iframe id="marco" title="La Villa · Abastecimiento" allow="clipboard-write; web-share"></iframe>
<a id="plan" href="#" target="_blank" rel="noopener">¿No carga? Abrir en el navegador</a>
<script>
// Enlace de la aplicación (Google Apps Script). Si se crea una implementación nueva, cambiar solo esta línea.
var APP = 'https://script.google.com/macros/s/AKfycbw7LUNs_5jrgyxSaPqSwReOErra4_TB4m0dieWTmLYNYQH8goIW6VdD-Fo_casZnERYvQ/exec';

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

var destino = APP;
document.getElementById('ir').href = destino;
document.getElementById('plan').href = destino;

var aviso = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault(); aviso = e;
  var b = document.getElementById('instalar'); b.style.display = 'inline-block';
  b.onclick = function () { aviso.prompt(); aviso.userChoice.then(function () { b.style.display = 'none'; }); };
});
window.addEventListener('appinstalled', function () {
  document.getElementById('ayuda').innerHTML = '✓ Listo. Ya puede abrir <b>Abastecimiento</b> desde la pantalla de inicio.';
});

var instalado = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
var movil = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (instalado && !movil) {
  // Computador (Mac o Windows): abrir la app dentro de esta ventana, para que no se abra una segunda ventana del navegador.
  document.body.className = 'marco';
  document.getElementById('marco').src = destino;
  setTimeout(function () { document.getElementById('plan').style.display = 'inline-block'; }, 8000);
} else if (instalado || location.hash === '#app') {
  location.replace(destino);
} else {
  document.getElementById('ayuda').innerHTML = ios
    ? 'Para dejar el ícono en su celular: toque <b>Compartir</b> (cuadro con flecha) y luego <b>Agregar a inicio</b>.'
    : 'Para dejar el ícono en su celular toque <b>Instalar en este celular</b>. Si no aparece: en Chrome, menú <b>⋮</b> → <b>Instalar app</b> o <b>Agregar a la pantalla principal</b>.';
}
</script>
</body>
</html>
